<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shweta &amp; Pragy · 21.11.2026</title>
<meta name="description" content="Wedding invitation — Shweta &amp; Pragy, 21 November 2026, Ghaziabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=Great+Vibes&amp;family=Tiro+Devanagari+Hindi&amp;display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#f5e4e1;overflow-x:clip;font-family:'Cormorant Garamond',Georgia,serif;color:#6b4636;}
  *{box-sizing:border-box;}
  @keyframes fall{0%{transform:translate3d(0,-12vh,0) rotate(0deg);}100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot));}}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(212,175,106,.5),0 10px 30px rgba(140,70,80,.25);}50%{box-shadow:0 0 0 12px rgba(212,175,106,0),0 10px 30px rgba(140,70,80,.25);}}
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:#f5e4e1;transform:translateZ(0);will-change:transform;}
  .bg video{width:100%;height:100%;object-fit:cover;display:block;}
  .bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 32%,rgba(255,250,246,.38),rgba(245,228,225,.74) 78%);}
  .petals{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;transform:translateZ(0);}
  .petal{position:absolute;top:0;border-radius:150% 0 150% 0;background:linear-gradient(135deg,#fde2e7,#f29bb0);opacity:.8;box-shadow:0 2px 4px rgba(180,80,100,.15);}
  .wrap{position:relative;z-index:2;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:34px 20px;}
  .card{width:100%;max-width:450px;background:rgba(255,250,246,.9);border:1.5px solid #c9a15c;border-radius:14px;padding:12px;box-shadow:0 20px 54px rgba(150,80,90,.24);}
  .inner{border:1px solid #e3c991;border-radius:9px;padding:40px 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;}
  .seal{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7e3b4,#d4af6a 55%,#a9803d);display:flex;align-items:center;justify-content:center;border:3px solid #f6e6c2;animation:glow 2.8s ease-in-out infinite;margin-bottom:10px;}
  .seal span{font-family:'Great Vibes',cursive;font-size:40px;color:#6e3a2a;line-height:1;padding-top:4px;}
  .invited{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:#7a3b4a;}
  .names{font-family:'Great Vibes',cursive;font-size:clamp(44px,13vw,60px);line-height:1.05;color:#9a6a22;text-shadow:0 1px 0 rgba(255,255,255,.6);margin:2px 0;}
  .date{font-size:16px;letter-spacing:.3em;color:#8a5a3c;}
  .divider{display:flex;align-items:center;gap:10px;width:72%;margin:20px 0 16px;}
  .divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,#c9a15c,transparent);}
  .divider .dot{width:7px;height:7px;background:#c9a15c;transform:rotate(45deg);}
  .q{font-size:19px;font-weight:600;color:#4f2e20;}
  .qhi{font-family:'Tiro Devanagari Hindi',serif;font-size:16px;color:#5e3a2a;margin-bottom:6px;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:12px;}
  a.side{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:18px 10px;border-radius:9px;border:1.5px solid #c9a15c;background:#fff;color:#6e3d22;transition:transform .2s ease,background .2s ease,box-shadow .2s ease,color .2s ease,border-color .2s ease;}
  a.side:hover,a.side:active{transform:translateY(-2px);background:linear-gradient(135deg,#c4506f,#9e3350);color:#fff8f3;border-color:#9e3350;box-shadow:0 12px 26px rgba(158,51,80,.3);}
  a.side .en{font-size:18px;font-weight:600;letter-spacing:.03em;}
  a.side .hi{font-family:'Tiro Devanagari Hindi',serif;font-size:14px;}
  .foot{margin-top:20px;font-size:15px;font-weight:600;color:#6b4636;line-height:1.4;}
  .foothi{font-family:'Tiro Devanagari Hindi',serif;font-size:13px;color:#8a6050;margin-top:2px;}
  @media(max-width:360px){.btns{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="bg"><video src="./assets/bg-portrait.mp4" autoplay muted loop playsinline preload="auto"></video></div>
  <div class="petals" id="petals"></div>
  <div class="wrap">
    <div class="card"><div class="inner">
      <div class="seal"><span>S&amp;P</span></div>
      <div class="invited">You are invited</div>
      <div class="names">Shweta &amp; Pragy</div>
      <div class="date">21 · 11 · 2026</div>
      <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
      <div class="q">Which side are you joining from?</div>
      <div class="qhi">आप किस पक्ष से आ रहे हैं?</div>
      <div class="btns">
        <a class="side" href="./bride"><span class="en">Bride's side</span><span class="hi">वधू पक्ष · श्वेता</span></a>
        <a class="side" href="./groom"><span class="en">Groom's side</span><span class="hi">वर पक्ष · प्रज्ञ</span></a>
      </div>
      <div class="foot">Imperial Garden &amp; Resorts, Ghaziabad<div class="foothi">शनिवार, २१ नवंबर २०२६</div></div>
    </div></div>
  </div>
  <script>
    // Light falling-petal layer (fewer on small screens).
    (function(){
      var host=document.getElementById('petals');
      var n=window.innerWidth<600?10:18, cols=[['#fde2e7','#f29bb0'],['#fbd0da','#e9879f'],['#fff1f3','#f5b5c4']];
      for(var i=0;i<n;i++){
        var p=document.createElement('div');p.className='petal';
        var s=10+Math.random()*12,c=cols[i%3];
        p.style.width=s+'px';p.style.height=(s*0.8)+'px';
        p.style.left=(Math.random()*100)+'%';
        p.style.background='linear-gradient(135deg,'+c[0]+','+c[1]+')';
        p.style.setProperty('--dx',(Math.random()*140-70)+'px');
        p.style.setProperty('--rot',((Math.random()>0.5?1:-1)*(360+Math.random()*360))+'deg');
        p.style.animation='fall '+(9+Math.random()*9)+'s linear '+(-Math.random()*16)+'s infinite';
        host.appendChild(p);
      }
      // Belt-and-suspenders: keep the bg video playing muted.
      var v=document.querySelector('.bg video'); if(v){v.muted=true;v.play&&v.play().catch(function(){});}
    })();
  </script>
</body>
</html>
